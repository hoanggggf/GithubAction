name: Matrix and conditions

on:
    workflow_dispatch:

concurrency:
    group: ${{github.workflow}}-${{github.ref}}
    cancel-in-progress: true

jobs:
    matrix-job:
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: true
            matrix:
                number: [ 1, 2 ]
                letter: [ a, b, c ]
                exclude:
                    - number: 2
                      letter: b
        timeout-minutes: 5

        steps:
            - name: Echo number and letter
              run: |
                  echo "number: ${{ matrix.number }}"
                  echo "letter: ${{ matrix.letter }}"

            - name: Run everything except 2c
              if: ${{ !(matrix.number == 2 && matrix.letter == 'c') }}
              run: echo "This runs for all combinations except number=2 and letter=c"

    sleep-job:
        runs-on: ubuntu-22.04
        steps:
            - name: Sleep for 10 minutes
              run: sleep 600
