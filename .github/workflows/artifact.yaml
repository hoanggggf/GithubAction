name: Artifacts

on:
    workflow_dispatch:

jobs:
    artifact-producer:
        name: Producer artifact
        runs-on: ubuntu-22.04
        steps:
            - name: Create a artifact
              run: |
                  echo "This will be stored as an artifact!" >> artifact.txt 
                  echo "Generated by artifact-producer job on $(date)" >> artifact.txt 

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: example-artifact
                  path: artifact.txt

    artifact-consumer:
        name: Consumer artifact
        runs-on: ubuntu-22.04
        needs: artifact-producer
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v5
              with: 
                name: example-artifact 

            - name: Cat artifact.txt
              run: cat artifact.txt
