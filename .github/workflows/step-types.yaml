name: Step Types 

on: 
    workflow_dispatch: 

jobs:
    say-hello-inline-bash:
        runs-on: ubuntu-22.04
        steps:
            - run: echo "Say Hello from hoanggggf inline bash"

    say-hello-inline-python: 
        runs-on: ubuntu-22.04
        steps:
          - run: print("Say Hello from hoanggggf inline python")
            shell: python

    say-hello-action: 
        runs-on: ubuntu-22.04
        steps:
          - uses: actions/hello-world-javascript-action@081a6d193d1dcb38460df1e6927486d748730f9d # v1.1
            with:
                who-to-greet: "from ac action in the GITHUB MARKETPLACE"
