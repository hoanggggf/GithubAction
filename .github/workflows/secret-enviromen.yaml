name: Secrets and Environments

on:
    workflow_dispatch:

jobs:
    staging-enviroment:
        runs-on: ubuntu-22.04
        environment: staging
        env:
            EXAMPLE_REPOSIROTY_SECRET: ${{ secrets.REPO_SECRET}}
            EXAMPLE_REPOSITORY_VARIABLE: ${{ vars.REPOS_ENV}}

            EXAMPLE_ENVIROMENT_SECRET: ${{ secrets.ENV_SECRET}}
            EXAMPLE_ENVIROMENT_VARIABLE: ${{ vars.ENV_VAR}}
        steps:
            - name: Inspect values inside job
              run: |
                  echo "Repo secret (masked)  $EXAMPLE_REPOSIROTY_SECRET"
                  echo "Repo variable:        $EXAMPLE_REPOSIROTY_VARIABLE"
                  echo "Env secret (masked)   $EXAMPLE_ENVIROMENT_SECRET"
                  echo "Env variable (masked) $EXAMPLE_ENVIROMENT_VARIABLE"
    production_enviroment:
        runs-on: ubuntu-22.04
        environment: production
        env:
            EXAMPLE_REPOSIROTY_SECRET: ${{ secrets.REPO_SECRET}}
            EXAMPLE_REPOSITORY_VARIABLE: ${{ vars.REPOS_ENV}}

            EXAMPLE_ENVIROMENT_SECRET: ${{ secrets.ENV_SECRET}}
            EXAMPLE_ENVIROMENT_VARIABLE: ${{ vars.ENV_VAR}}
        steps:
            - name: Inspect values inside job
              run: |
                  echo "Repo secret (masked)  $EXAMPLE_REPOSIROTY_SECRET"
                  echo "Repo variable:        $EXAMPLE_REPOSIROTY_VARIABLE"
                  echo "Env secret (masked)   $EXAMPLE_ENVIROMENT_SECRET"
                  echo "Env variable (masked) $EXAMPLE_ENVIROMENT_VARIABLE"
